[project]
name = "autoeditor-backend"
version = "0.1.0"
description = "自动剪辑软件本地服务（FastAPI + SQLAlchemy + SQLite 任务队列）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "sse-starlette>=2.1,<3",
    "pillow>=11,<12",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
